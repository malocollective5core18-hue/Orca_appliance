name: orca_mobile
description: "ORCA mobile demo app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/orca-logo-w.png
    - assets/orca-logo-B.png
    - assets/orca-intro.mp4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/orca-logo-B.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/orca-logo-B.png
