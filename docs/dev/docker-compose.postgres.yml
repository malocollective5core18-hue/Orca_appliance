# Disposable developer database only. Never change this to a hosted or production database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orca_test
      POSTGRES_USER: orca_dev
      POSTGRES_PASSWORD: orca_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca_dev -d orca_test"]
      interval: 3s
      timeout: 3s
      retries: 20
