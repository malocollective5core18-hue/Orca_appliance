<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORCA</title>
<script>(function(){var t;try{t=localStorage.getItem('nm-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})();</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fs-micro:.6875rem;--fs-meta:.75rem;--fs-sup:.8125rem;--fs-ui:.875rem;--fs-body:.9375rem;--fs-h:1.125rem;--fs-title:1.5rem;--fs-hero:clamp(2rem,9vw,2.5rem);--r:14px;--sh:0 1px 2px rgba(17,17,17,.05),0 4px 12px rgba(17,17,17,.05);--sh-up:0 -6px 20px rgba(17,17,17,.07);--sh-in:inset 0 1px 2px rgba(17,17,17,.06);--outer:#dcdcd8;--bg:#f6f6f4;--surface:#fff;--surface2:#ebebe8;--text:#111;--muted:#5a5a56;--line:#d6d6d2;--dotc:transparent;--card:#111;--ctext:#f2f2f0;--cmuted:#a8a8a4;--cok:#ff5a60;--cwarn:#f0b84a;--cline:#333;--glow:none;--field:#85857f;--ok:#0f7a3d;--warn:#8a5a00;--err:#b3121a;--focus:#111;--primary:#d71921;--on-primary:#fff;color-scheme:light;box-sizing:border-box}
:root[data-theme=dark]{color-scheme:dark;--sh:0 1px 2px rgba(0,0,0,.5),0 6px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.04);--sh-up:0 -8px 24px rgba(0,0,0,.5);--sh-in:inset 0 1px 3px rgba(0,0,0,.5);--outer:#000;--bg:#0d0d0d;--surface:#171717;--surface2:#242424;--text:#f2f2f0;--muted:#858582;--line:#2e2e2e;--dotc:transparent;--card:#f4f4f2;--ctext:#0d0d0d;--cmuted:#5a5a56;--cok:#d71921;--cwarn:#8a5a00;--cline:#bdbdb8;--glow:none;--field:#6f6f6b;--ok:#5fd08b;--warn:#f0b84a;--err:#ff7a7a;--focus:#f2f2f0}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--outer);color:var(--text);font:400 var(--fs-body)/1.4 'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{max-width:420px;margin:0 auto;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px calc(78px + env(safe-area-inset-bottom));height:100vh;height:100dvh;display:flex;flex-direction:column}
[hidden]{display:none!important}
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.flow{flex:1;display:flex;flex-direction:column;min-height:0}
.fh{display:flex;align-items:center;justify-content:space-between}
.fh .back{margin:0}
.fh .ttl{font-size:1.25rem;margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1:focus{outline:none}
button,a,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.logo{width:44px;height:44px;flex:none}
.lb{display:none}
:root[data-theme=light] .lw{display:none}
:root[data-theme=light] .lb{display:block}
.brand b{display:block;font-size:var(--fs-ui);font-weight:500}
.cur{font-weight:500;letter-spacing:.06em}
.tools{display:flex;gap:6px}
.gb{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--field);background:none;font-size:var(--fs-sup);cursor:pointer}
.demo{margin:8px 0 0;padding:6px 12px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:var(--fs-meta)}
.demo::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-right:8px;vertical-align:middle}
.hero{text-align:center;margin:10px 0}
.lbl,.cur{color:var(--muted);font-size:var(--fs-sup)}
.bal{font:600 var(--fs-hero)/1.1 'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:8px 0 2px;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:92px;justify-content:center;padding:10px 4px;text-align:center;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh);text-decoration:none;font-size:var(--fs-sup)}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg);font-size:var(--fs-ui)}
.ic svg{display:block}
.act b{font-weight:500;font-size:var(--fs-ui)}
.act small{color:var(--muted);font-size:var(--fs-meta);line-height:1.25}
.cta{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 18px 0 10px;border-radius:99px;background:var(--primary);color:var(--on-primary);text-decoration:none;box-shadow:var(--sh)}
.cta .ic{background:rgba(255,255,255,.2);color:#fff}
.cta::after{content:"›";content:"›" / "";font-size:1.5rem;line-height:1}
.ct{flex:1;display:flex;flex-direction:column}
.ct b{font-weight:500;font-size:var(--fs-body)}
.ct small{font-size:var(--fs-meta)}
.qs h2{font-size:var(--fs-sup);color:var(--muted);font-weight:400;margin:14px 0 8px}
.qrow{display:flex;gap:8px}
.qc{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh);font-size:var(--fs-sup);cursor:pointer}
.cta:active,.act:active,.qc:active{transform:translateY(1px);box-shadow:none}
.hd{display:flex;justify-content:space-between;align-items:center;margin:8px 0 2px}
h2{font-size:var(--fs-h);font-weight:500}
.lnk{font-size:var(--fs-sup);min-height:36px;display:inline-flex;align-items:center;padding:0 4px}
.list{list-style:none;padding:2px 18px;background:var(--card);color:var(--ctext);border-radius:26px;box-shadow:var(--sh);--text:var(--ctext);--muted:var(--cmuted);--ok:var(--cok);--warn:var(--cwarn);--line:var(--cline)}
.tx{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.av{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--text);display:grid;place-items:center;font:500 var(--fs-meta) 'Space Grotesk',system-ui,sans-serif;flex:none}
.who{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-size:var(--fs-ui);font-weight:500;overflow-wrap:anywhere}
.mt{font-size:var(--fs-meta);color:var(--muted)}
.amt{font:500 var(--fs-body) 'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok)}.amt.req{color:var(--warn)}
.empty{padding:20px 0;color:var(--muted);font-size:var(--fs-ui)}
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-size:var(--fs-ui);text-decoration:none}
.ttl{font-size:1.25rem;font-weight:500;margin:4px 0 8px}
.form{display:flex;flex:1;flex-direction:column;gap:8px;margin-top:6px}
label{display:block;font-size:var(--fs-ui);font-weight:500;margin-bottom:4px}
input,select{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--field);background:var(--surface);box-shadow:var(--sh-in)}
input[aria-invalid=true]{border-color:var(--err)}
.chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-top:6px}
.chip{flex:none;min-height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-sup);cursor:pointer}
.err{color:var(--err);font-size:var(--fs-sup);margin-top:6px}
.err:empty{display:none}
.pre{color:var(--muted);font-size:var(--fs-sup);min-height:1.4em;text-align:center}
.btn{min-height:48px;padding:0 20px;border-radius:99px;border:0;background:var(--primary);color:var(--on-primary);font-weight:500;cursor:pointer;width:100%;box-shadow:var(--sh)}
.btn.sec{background:var(--surface2);color:var(--text)}
.btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.msg{margin-top:0;font-size:var(--fs-sup);color:var(--muted)}
.msg:empty{display:none}
.msg.ok{color:var(--ok)}
.row2{display:flex;gap:8px;margin-top:14px}
.nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:99px;background:var(--text);box-shadow:var(--sh)}
.nav a{min-height:44px;width:84px;border-radius:99px;display:grid;place-items:center;text-decoration:none;font-size:var(--fs-sup);color:var(--bg)}
.nav a[aria-current=page]{background:var(--bg);color:var(--text);font-weight:500}
.amtw label{text-align:center;color:var(--muted);font-weight:400;font-size:var(--fs-sup);margin-bottom:0}
.amtw .err{text-align:center}
.big{border:0;background:none;color:var(--text);text-align:center;font:600 var(--fs-hero)/1.1 'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-height:64px;padding:0}
.amtw .big{font-size:clamp(2rem,9dvh,3rem);min-height:0;height:clamp(48px,10dvh,72px);box-shadow:none}
.form input,.form select,.form .btn{min-height:44px}
.big::placeholder{color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,clamp(45px,calc(6.5dvh + 7px),55px));gap:6px;flex:none}
.form .amtw{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pad button{min-height:0;border-radius:99px;background:var(--surface2);border:0;box-shadow:var(--sh);font-size:1.125rem;cursor:pointer}
.pad button:active{box-shadow:none;transform:translateY(1px)}
dialog{width:100%;max-width:480px;margin:auto auto 0;border:0;border-radius:20px 20px 0 0;box-shadow:var(--sh-up);background:var(--surface);color:var(--text);padding:20px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
.note{color:var(--muted);font-size:var(--fs-sup);margin:6px 0 12px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:var(--fs-ui)}
.sum dt{color:var(--muted)}.sum dd{margin:0;text-align:right;overflow-wrap:anywhere}
.sum .tot dd{font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.btn,.act,.gb,.chip,input,select{border:1px solid ButtonText}.nav a[aria-current=page]{border-top:3px solid Highlight}}
.dev{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--sh)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dh b{display:block;font-weight:500;font-size:var(--fs-ui)}
.dh small{color:var(--muted);font-size:var(--fs-meta)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-meta);padding:4px 10px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.st.restricted::before{background:var(--err)}
.trk{height:8px;border-radius:99px;background:var(--surface2);margin:10px 0 6px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--text);border-radius:99px}
.dm{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-meta);color:var(--muted)}
.dv{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;background:var(--surface);border-radius:20px;padding:0 16px;box-shadow:var(--sh);margin:8px 0}
.dv div{flex-direction:column;align-items:flex-start;gap:2px;padding:8px 0;font-size:var(--fs-sup)}
.dv div:nth-child(-n+2){border-top:0}
.dv dd{text-align:left;font-weight:500}
main .note{margin:6px 0}
.scr{flex:0 1 auto;min-height:0;overflow-y:auto}
.prow{display:flex;gap:8px;margin:10px 0 14px}
#link-code{letter-spacing:.12em}
@media (max-height:660px){.prow{margin:6px 0 8px}}
@media (max-height:660px) and (max-width:767px){
.app{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.nav{bottom:calc(8px + env(safe-area-inset-bottom))}
.app .nav a{min-height:40px}
.gb{min-height:36px}
.demo{padding:4px 10px;margin-top:6px}
.bal{font-size:clamp(1.75rem,8vw,2.25rem)}
.hero{margin:4px 0 6px}
.cta{min-height:48px}
.dev{padding:10px}
.tx{padding:6px 0}
.pad{grid-template-rows:repeat(4,clamp(36px,6dvh,44px))}
.form{gap:6px}
.amtw .big{height:clamp(40px,8dvh,52px)}
.ttl{margin:0 0 6px}
.dv div{padding:5px 0}
}
@media (min-width:768px){
body .app{max-width:1040px;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:28px;padding:max(16px,env(safe-area-inset-top)) 28px 20px}
.app>.top,.app>.demo{grid-column:1/-1}
.app>.nav{grid-column:1;grid-row:3;position:static;transform:none;flex-direction:column;align-self:start;background:none;box-shadow:none;padding:0;border-radius:0;gap:4px;margin-top:8px}
.app .nav a{width:auto;place-items:center start;padding:0 16px;color:var(--text);min-height:44px;border-radius:12px}
.app .nav a[aria-current=page]{background:var(--surface);box-shadow:var(--sh)}
.app>main{grid-column:2;grid-row:3;min-height:0}
.flow{max-width:460px;max-height:720px;width:100%;margin:0 auto}
main>section:not(.flow){max-width:640px;width:100%;margin:0 auto}
dialog{margin:auto;border-radius:20px;max-width:440px}
}
@media (min-width:1100px){
main>section.home{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;align-content:start;align-items:start;grid-auto-flow:dense}
.home>.hero,.home>.cta,.home>.chips{grid-column:1}
.home>div[style],.home>.hd,.home>.list{grid-column:2}
}
.prow select{flex:1.2;min-width:0}
.prow .btn{flex:1;width:auto}
.toward{color:var(--muted);font-size:var(--fs-sup);text-align:center}
.nav a{width:76px}
</style>
</head>

<script>
function seed(){return[{n:'Installment',w:'5 Oct',a:62000,k:'pay',s:'Sample · M-Pesa'},{n:'Installment',w:'12 Sep',a:100000,k:'pay',s:'Sample · M-Pesa'},{n:'Installment',w:'12 Aug',a:100000,k:'pay',s:'Sample · Bank transfer'},{n:'Installment',w:'12 Jul',a:100000,k:'pay',s:'Sample · M-Pesa'},{n:'Installment',w:'12 Jun',a:100000,k:'pay',s:'Sample · M-Pesa'}]}

var S=fresh(),FX={};
var fmt=function(n){return n.toLocaleString('en-US')};
var rem=function(){return S.dev.total-S.dev.paid};
var pct=function(){return Math.floor(S.dev.paid/S.dev.total*100)};
var left=function(){return Math.ceil(rem()/S.dev.monthly)};

function ico(p){var s=h('span',{class:'ic','aria-hidden':'true'});s.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';return s}
function row(t){return h('li',{class:'tx'},h('span',{class:'av','aria-hidden':'true'},'IN'),h('div',{class:'who'},h('span',{class:'nm'},t.n),h('span',{class:'mt'},t.w+' · '+t.s)),h('span',{class:'amt pay'},fmt(t.a)+' TZS'))}

function devCard(){var d=S.dev;return h('div',{class:'dev'},h('div',{class:'dh'},h('div',{},h('b',{},d.name),h('small',{},d.cat)),h('span',{class:'st '+d.status},d.status==='active'?'Active':'Restricted')),h('div',{class:'trk',role:'img','aria-label':pct()+' percent paid'},h('i',{style:'width:'+pct()+'%'})),h('div',{class:'dm'},h('span',{},pct()+'% owned'),h('span',{},fmt(d.paid)+' of '+fmt(d.total)+' TZS')))}

(function(){

  var num=function(){return +(amt.value.replace(/\D/g,''))||0};

  amt.addEventListener('input',function(){var d=amt.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,9);amt.value=d?(+d).toLocaleString('en-US'):'';msg.textContent='';if(amt.getAttribute('aria-invalid'))chk();upd()});

  form.append(h('div',{class:'amtw'},amtLab,amt,er),qk,pad,pre,h('div',{class:'prow'},meth,h('button',{class:'btn',type:'submit'},'Review')));
  form.addEventListener('submit',function(e){e.preventDefault();if(S.busy)return;if(chk()){msg.textContent='Fix the amount to continue.';amt.focus();return}review()});
  function review(){var n=num(),dl=h('dl',{class:'sum'});function r(k,v,b){dl.append(h('div',{class:b?'tot':''},h('dt',{},k),h('dd',{},v)))}
    r('Appliance',S.dev.name);r('Method',meth.value);r('Amount',fmt(n)+' TZS',1);r('Due after',fmt(Math.max(0,S.due-n))+' TZS');r('Remaining after',fmt(rem()-n)+' TZS');
    var ok=h('button',{class:'btn',type:'button'},'Confirm demo'),no=h('button',{class:'btn sec',type:'button',onclick:function(){dlg.close();msg.textContent='Cancelled. No payment was recorded.'}},'Cancel');
    ok.addEventListener('click',function(){if(S.busy)return;S.busy=true;ok.disabled=no.disabled=true;ok.textContent='Processing demo…';
      setTimeout(function(){var n2=num(),m='Demo payment recorded. No money moved and your device was not changed.';
        S.dev.paid+=n2;S.due=Math.max(0,S.due-n2);S.txs.unshift({n:'Installment',w:'Just now',a:n2,k:'pay',s:'Demo · '+meth.value});
        if(S.due===0&&S.dev.status==='restricted'){S.dev.status='active';m+=' Demo status set to Active; the real status comes from ORCA Cloud.'}
        S.busy=false;form.reset();er.textContent='';amt.removeAttribute('aria-invalid');pre.textContent='';dlg.close();render();msg.className='msg ok';msg.textContent=m},900)});
    dlg.replaceChildren(h('h2',{id:'dt'},'Review: Pay installment'),h('p',{class:'note'},'Demo payment. No money will move and your device is not affected.'),dl,h('div',{class:'row2'},no,ok));dlg.showModal()}
  ups.push(function(){amtLab.textContent='Amount toward your '+S.dev.cat+' (TZS)';qk.replaceChildren.apply(qk,quick(setAmt))});
  secs.pay=h('section',{hidden:'',class:'flow'},h('div',{class:'fh'},h('a',{class:'back',href:'#home'},'\u2190 Back'),h('h1',{class:'ttl',tabindex:'-1'},'Pay installment')),form,msg);
})();

(function(){
  var inp=h('input',{id:'link-code',type:'text',inputmode:'none',autocomplete:'off',placeholder:'000 000',class:'big','aria-describedby':'link-e'}),er=h('p',{class:'err',id:'link-e'}),pre=h('p',{class:'pre'}),msg=h('p',{class:'msg',role:'status'}),form=h('form',{novalidate:'',class:'form'});
  var digs=function(){return inp.value.replace(/\D/g,'')};
  function chk(){var d=digs(),m=d.length===0?'Enter the 6-digit code shown on your TV.':d.length<6?'The code has 6 digits. You entered '+d.length+'.':'';er.textContent=m?'Error: '+m:'';if(m)inp.setAttribute('aria-invalid','true');else inp.removeAttribute('aria-invalid');return m}
  inp.addEventListener('input',function(){var d=digs().slice(0,6);inp.value=d.length>3?d.slice(0,3)+' '+d.slice(3):d;msg.textContent='';if(inp.getAttribute('aria-invalid'))chk();pre.textContent=d.length===6?'Demo: any 6-digit code works.':''});
  var pad=h('div',{class:'pad'},['1','2','3','4','5','6','7','8','9','','0','\u232b'].map(function(k){return k===''?h('span',{'aria-hidden':'true'}):h('button',{type:'button','aria-label':k==='\u232b'?'Delete':k,onclick:function(){var d=digs(),v=k==='\u232b'?d.slice(0,-1):d+k;inp.value=v;inp.dispatchEvent(new Event('input'))}},k)}));
  form.append(h('div',{class:'amtw'},h('label',{for:'link-code'},'Activation code shown on your TV'),inp,er),pad,pre,h('div',{class:'prow'},h('button',{class:'btn',type:'submit'},'Link TV')));
  form.addEventListener('submit',function(e){e.preventDefault();if(S.busy)return;if(chk()){msg.className='msg';msg.textContent='Fix the code to continue.';inp.focus();return}review()});
  function review(){var dl=h('dl',{class:'sum'});function r(k,v,b){dl.append(h('div',{class:b?'tot':''},h('dt',{},k),h('dd',{},v)))}
    r('Activation code',inp.value,1);r('Appliance',S.dev.name);
    var ok=h('button',{class:'btn',type:'button'},'Confirm demo'),no=h('button',{class:'btn sec',type:'button',onclick:function(){dlg.close();msg.className='msg';msg.textContent='Cancelled. Your TV was not linked.'}},'Cancel');
    ok.addEventListener('click',function(){if(S.busy)return;S.busy=true;ok.disabled=no.disabled=true;ok.textContent='Processing demo…';
      setTimeout(function(){S.tvLinked=true;S.busy=false;form.reset();er.textContent='';inp.removeAttribute('aria-invalid');pre.textContent='';dlg.close();render();msg.className='msg ok';msg.textContent='Demo: TV linked. No real TV was connected.'},900)});
    dlg.replaceChildren(h('h2',{id:'dt'},'Review: Link TV'),h('p',{class:'note'},'Demo link. No real TV will be connected.'),dl,h('div',{class:'row2'},no,ok));dlg.showModal()}
  secs.link=h('section',{hidden:'',class:'flow'},h('div',{class:'fh'},h('a',{class:'back',href:'#device'},'\u2190 Back'),h('h1',{class:'ttl',tabindex:'-1'},'Link TV')),form,msg);
})();

function render(){
  dueEl.textContent=S.hide?'••••••':fmt(S.due);dueEl.setAttribute('aria-label',S.hide?'Amount hidden':fmt(S.due)+' Tanzanian shillings due');
  dueMeta.textContent='TZS · '+(rem()===0?'Fully paid':S.due===0?'Paid, next due '+S.dev.next:'due '+S.dev.next);
  homeDev.replaceChildren(devCard());homeQ.replaceChildren.apply(homeQ,quick(function(v){FX.set(v);location.hash='#pay'}));
  recent.replaceChildren.apply(recent,S.txs.slice(0,2).map(row));all.replaceChildren.apply(all,S.txs.map(row));all.hidden=recent.hidden=!S.txs.length;empty.hidden=!!S.txs.length;
  var d=S.dev,dv=h('dl',{class:'sum dv'});[['Total price',fmt(d.total)+' TZS'],['Paid so far',fmt(d.paid)+' TZS'],['Remaining',fmt(rem())+' TZS'],['Monthly installment',fmt(d.monthly)+' TZS'],['Next due',d.next],['Payments left',String(left())]].forEach(function(r){dv.append(h('div',{},h('dt',{},r[0]),h('dd',{},r[1])))});
  devBox.replaceChildren(devCard(),dv);
  devStat.textContent=(d.status==='active'?'Your device is Active and works normally.':'Your device is Restricted until the amount due is paid.')+(S.tvLinked?' TV linked (demo).':' TV not linked yet.');
  devBtn.textContent=d.status==='active'?'Demo: simulate overdue':'Demo: simulate paid up';
  ups.forEach(function(f){f()});
}
dlg.addEventListener('cancel',function(e){if(S.busy)e.preventDefault()});
['home','pay','device','link','activity'].forEach(function(k){main.append(secs[k])});
function route(first){var r=location.hash.slice(1);if(!secs[r])r='home';
  for(var k in secs)secs[k].hidden=k!==r;
  document.querySelectorAll('.nav a').forEach(function(a){if(a.getAttribute('href')==='#'+(r==='link'?'device':r))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var hd=secs[r].querySelector('h1');document.title=hd.textContent+' · ORCA';if(!first){hd.focus({preventScroll:true});window.scrollTo(0,0)}}
window.addEventListener('hashchange',function(){route()});
var hb=document.getElementById('hide');hb.onclick=function(){S.hide=!S.hide;hb.setAttribute('aria-pressed',S.hide);hb.textContent=S.hide?'Show amount':'Hide amount';render()};
var tb=document.getElementById('theme');
function setTheme(t,save){document.documentElement.dataset.theme=t;if(save)try{localStorage.setItem('nm-theme',t)}catch(e){}var n=t==='dark'?'light':'dark';tb.textContent=n==='light'?'Light':'Dark';tb.setAttribute('aria-label','Switch to '+n+' theme')}
tb.onclick=function(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',1)};
setTheme(document.documentElement.dataset.theme);render();route(1);
</script>
