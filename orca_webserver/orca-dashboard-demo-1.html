<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORCA Control dashboard (demo)</title>
<script>(function(){var t;try{t=localStorage.getItem('orca-dash-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})();</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--panel:#fff;--panel2:#ebebe8;--text:#111;--muted:#5a5a56;--line:#dcdcd8;--field:#85857f;--ok:#0f7a3d;--warn:#8a5a00;--err:#b3121a;--red:#d71921;--focus:#111;--sh:0 1px 2px rgba(17,17,17,.05),0 4px 12px rgba(17,17,17,.05);color-scheme:light}
:root[data-theme=dark]{--bg:#0d0d0d;--panel:#171717;--panel2:#242424;--text:#f2f2f0;--muted:#9a9a96;--line:#2e2e2e;--field:#6f6f6b;--ok:#5fd08b;--warn:#f0b84a;--err:#ff7a7a;--focus:#f2f2f0;--sh:0 1px 2px rgba(0,0,0,.5),0 6px 14px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.4 'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;height:100dvh;overflow:hidden}
button,input,select,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);height:100dvh}
.side{border-right:1px solid var(--line);background:var(--panel);padding:16px 12px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:40px;height:40px}.brand b{font-size:16px;letter-spacing:.1em}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em}
.lb{display:none}:root[data-theme=light] .lw{display:none}:root[data-theme=light] .lb{display:block}
nav{display:grid;gap:2px}
nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--muted)}
nav a:hover{background:var(--panel2);color:var(--text)}
nav a[aria-current=page]{background:var(--panel2);color:var(--text);font-weight:500;box-shadow:inset 3px 0 0 var(--red)}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;min-width:20px;text-align:center}
.note{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.45;border-top:1px solid var(--line);padding-top:12px}
.main{display:flex;flex-direction:column;min-width:0;height:100dvh}
.bar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar input,.bar select,.ctl select,.ctl input{height:38px;border-radius:10px;border:1px solid var(--field);background:var(--panel);padding:0 12px}
.bar input[type=search]{flex:1;max-width:420px}
.btn{min-height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--field);background:var(--panel);cursor:pointer;font-size:13px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.dng{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;background:var(--panel);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.restricted i,.chip.err i,.chip.failed i{background:var(--err)}.chip.offline i,.chip.warn i,.chip.pending i,.chip.degraded i{background:var(--warn)}.chip.off i{background:var(--field)}
.spacer{flex:1}
#view{flex:1;min-height:0;overflow:auto;padding:12px 20px 16px}
#view:focus{outline:none}
h1:focus{outline:none}
h1{font-size:20px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:10px}
h2{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:10px}
.kpi small{color:var(--muted);font-size:12px;display:block}.kpi b{font-size:20px;font-weight:600;letter-spacing:-.02em;display:block;margin:2px 0;white-space:nowrap}.kpi span{font-size:12px;color:var(--muted)}
.g{display:grid;gap:10px;margin-bottom:10px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.list{list-style:none;padding:0;display:grid}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.list li:first-child{border-top:0}
.list small{color:var(--muted);display:block;font-size:12px}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--panel2);margin:6px 0 10px}.seg i{display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}.leg b{color:var(--text);font-weight:500}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--sh);max-height:calc(100dvh - 190px)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .lnk{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.num{text-align:right}
.trk{height:6px;border-radius:99px;background:var(--panel2);width:90px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}.trk i{display:block;height:100%;background:var(--text)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--warn);flex:none}.sev.hi{background:var(--err)}.sev.lo{background:var(--field)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.25);padding:18px;overflow:auto;z-index:5}
#drawer[hidden]{display:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:4}#scrim[hidden]{display:none}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:12px 0}
.dl div{padding:8px 0;border-top:1px solid var(--line)}.dl dt{color:var(--muted);font-size:12px}.dl dd{margin:0;font-weight:500}
.steps{list-style:none;padding:0;display:grid;gap:6px;margin:8px 0}
.steps li{display:flex;gap:8px;align-items:center;color:var(--muted)}.steps li::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--field)}
.steps li.done{color:var(--text)}.steps li.done::before{background:var(--ok);border-color:var(--ok)}.steps li.now::before{border-color:var(--warn);background:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:20px;width:min(440px,92vw);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog label{display:block;margin:12px 0 4px;font-weight:500}dialog select{width:100%;height:40px;border-radius:10px;border:1px solid var(--field);background:var(--panel);padding:0 10px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.warn-t{color:var(--warn)}.err-t{color:var(--err)}
@media (max-height:800px) and (min-width:700px){.kpi span{display:none}.kpi b{margin:0}.g3 .list li:nth-child(n+3){display:none}.card{padding:10px 12px}h1{margin-bottom:6px}}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.ms{display:none!important}}
.cc{display:flex;flex-direction:column}.cc svg{flex:1 1 0;min-height:130px}
.ni{display:inline-flex}.nl{flex:1}.unit{font-style:normal;font-size:12px;font-weight:400;color:var(--muted);margin-left:5px}
.mbrand{display:none;align-items:center;gap:8px}.mbrand img{width:30px;height:30px}.mbrand b{letter-spacing:.1em;font-size:15px}
@media (min-width:700px) and (max-width:1180px){
.shell{grid-template-columns:76px minmax(0,1fr)}
.side{padding:12px 6px;align-items:stretch}
.brand{padding:0;justify-content:center}.brand div,.side .note{display:none}
nav a{flex-direction:column;justify-content:center;gap:3px;min-height:56px;padding:6px 2px;font-size:11px;text-align:center;position:relative}
nav a[aria-current=page]{box-shadow:inset 3px 0 0 var(--red)}
.nl{flex:none}.badge{position:absolute;top:2px;right:10px}
}
@media (max-width:699px){
body{overflow:auto;height:auto}
.shell{display:block;height:auto}
.side{display:contents}.brand,.side .note{display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:3;display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:4px 0;border-radius:0;font-size:10.5px;text-align:center;position:relative}
nav a:hover{background:none}
nav a[aria-current=page]{background:none;box-shadow:inset 0 3px 0 var(--red)}
.nl{flex:none}.badge{position:absolute;top:3px;left:calc(50% + 4px);font-size:10px;padding:0 5px;min-width:16px}
.main{height:auto}
.bar{position:sticky;top:0;z-index:2;flex-wrap:wrap;gap:8px;padding:10px 14px 10px;padding-top:calc(10px + env(safe-area-inset-top))}
.mbrand{display:flex;order:1}.bar .chip{order:2}.spacer{order:3;flex:1}#theme{order:4}
.bar input[type=search]{order:5;flex:1 1 52%;max-width:none}#range{order:6;flex:1 1 38%}
#view{overflow:visible;padding:12px 14px calc(76px + env(safe-area-inset-bottom))}
h1{font-size:19px}
.kpis,.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.k3{grid-template-columns:1fr}
.g2,.g3{grid-template-columns:1fr}
.ctl select{flex:1 1 40%}
.tw{border:0;box-shadow:none;background:none;max-height:none!important;overflow:visible}
table{min-width:0}table,tbody,tr,td{display:block;width:100%}thead{display:none}
tr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--sh)}
td{border:0;padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:normal;text-align:right}
td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex:none}
.dv tr{display:grid;grid-template-columns:1fr auto;column-gap:10px}
.dv td{grid-column:1/-1}.dv td:nth-child(1){grid-column:1;grid-row:1;text-align:left}.dv td:nth-child(5){grid-column:2;grid-row:1}
.dv td:nth-child(1)::before,.dv td:nth-child(5)::before{display:none}
.dv td:nth-child(1) .lnk{font-size:15px}
#drawer{width:100%;border-left:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
dialog{margin:auto auto 0;border-radius:18px 18px 0 0;width:100%;max-width:none;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (forced-colors:active){.card,.btn,.chip,.tw{border:1px solid CanvasText}}
</style>
</head>
