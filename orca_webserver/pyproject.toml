[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["apps"]
omit = ["*/migrations/*", "*/apps.py", "*/admin.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps", "config"]
extend-exclude = ["apps/**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
