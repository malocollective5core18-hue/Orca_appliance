<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ORCA account{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;font-family:'Space Grotesk',Inter,system-ui,sans-serif;background:#0d0d0d;color:#f8fafc;--orca-black:#0d0d0d;--orca-panel:#171717;--orca-white:#f2f2f0;--orca-muted:rgba(248,250,252,.68);--orca-red:#d71921;--orca-red-hover:#ff5a60;--orca-line:rgba(255,255,255,.14)}
    *{box-sizing:border-box}body{position:relative;isolation:isolate;margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(560px 420px at 82% -6%,rgba(255,255,255,.10),transparent 65%),radial-gradient(480px 360px at 8% 18%,rgba(215,25,33,.14),transparent 60%),var(--orca-black);color:var(--orca-white)}
    .brand-watermark{position:fixed;z-index:-2;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}.brand-watermark .brand-logo{width:min(78vw,760px);height:min(78vw,760px);object-fit:contain;opacity:.12;filter:drop-shadow(0 0 55px rgba(215,25,33,.28))}.brand-overlay{position:fixed;z-index:-1;inset:0;pointer-events:none;background:rgba(4,4,4,.70);background-image:radial-gradient(ellipse at center,rgba(13,13,13,.32),rgba(13,13,13,.78) 78%)}
    header{position:relative;z-index:1;min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:10px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid var(--orca-line);background:rgba(13,13,13,.76);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .brand-link{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700;letter-spacing:.12em}.brand-link .brand-logo{width:36px;height:36px;object-fit:contain}.lang{background:rgba(255,255,255,.06);color:var(--orca-white);border:1px solid var(--orca-line);border-radius:9px;padding:8px}
    main{position:relative;z-index:1;width:min(100% - 32px,560px);margin:clamp(24px,7vh,72px) auto}.wide{width:min(100% - 32px,900px)}
    .dashboard-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:8px;border:1px solid var(--orca-line);border-radius:13px;background:rgba(13,13,13,.68);backdrop-filter:blur(12px)}.dashboard-nav a{display:inline-flex;min-height:40px;align-items:center;padding:9px 13px;border-radius:8px;color:var(--orca-muted);text-decoration:none}.dashboard-nav a:hover,.dashboard-nav a[aria-current="page"]{background:rgba(255,255,255,.09);color:#fff}.dashboard-nav a[aria-current="page"]{box-shadow:inset 0 -2px var(--orca-red)}
    .card{background:rgba(17,17,17,.82);border:1px solid var(--orca-line);border-radius:20px;padding:clamp(20px,5vw,34px);box-shadow:0 24px 80px rgba(0,0,0,.48);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    h1{margin:0 0 8px;font-size:clamp(1.45rem,4vw,2rem);letter-spacing:-.025em}p{color:var(--orca-muted);line-height:1.55}label{display:block;margin:16px 0 6px;color:rgba(248,250,252,.86);font-size:.93rem}
    input,select{width:100%;min-height:46px;padding:10px 12px;border:1px solid rgba(255,255,255,.22);border-radius:9px;background:rgba(0,0,0,.52);color:var(--orca-white);font:inherit}input:focus,select:focus{outline:2px solid rgba(215,25,33,.68);outline-offset:1px}
    button,.button{display:inline-flex;justify-content:center;align-items:center;min-height:44px;border:0;border-radius:9px;padding:11px 16px;background:var(--orca-red);color:#fff;font-weight:700;text-decoration:none;cursor:pointer;font:inherit;transition:background .18s ease,transform .18s ease}button:hover,.button:hover{background:var(--orca-red-hover);transform:translateY(-1px)}
    .submit{width:100%;margin-top:20px}.secondary{background:rgba(255,255,255,.07);color:#eff4ef;border:1px solid var(--orca-line)}.secondary:hover{background:rgba(255,255,255,.13)}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .errorlist,.form-errors{color:#ff9a9e;padding-left:20px}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.muted{font-size:.9rem;color:var(--orca-muted)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tile{padding:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);border-radius:12px;margin-top:14px}.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.profile-grid .tile{margin:0;overflow-wrap:anywhere}.success{color:#ff8b90}
    @media(max-width:560px){header{min-height:60px;padding:8px 16px}.brand-link .brand-logo{width:31px;height:31px}.row{grid-template-columns:1fr}main{margin:24px auto}.links>*{width:100%}.brand-watermark .brand-logo{width:110vw;height:110vw;opacity:.10}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

    .brand-logo{content:url("/static/images/orca-logo-w.png")}
    html[data-theme="light"] .brand-logo{content:url("/static/images/orca-logo-B.png")}
  </style>
</head>
<body>
<div class="brand-watermark" aria-hidden="true"><img class="brand-logo" src="/static/images/orca-logo-w.png" alt=""></div><div class="brand-overlay" aria-hidden="true"></div>
<header><a class="brand-link" href="/" aria-label="ORCA home"><img class="brand-logo" src="/static/images/orca-logo-w.png" alt=""><span>ORCA</span></a><label class="muted" style="margin:0"><span data-en="Language" data-sw="Lugha">Language</span> <select class="lang language-select" aria-label="Language"><option value="en">English</option><option value="sw">Kiswahili</option></select></label></header>
{% block body %}{% endblock %}
<script src="/static/js/language.js" defer></script>
</body>
</html>
