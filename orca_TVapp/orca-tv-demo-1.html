<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORCA TV (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--panel:#171717;--panel2:#222;--text:#f2f2f0;--muted:#a8a8a4;--line:#2e2e2e;--red:#d71921;--ok:#5fd08b;--bad:#ff7a7a;--sh:0 1px 2px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#stage{flex:1;min-height:0;position:relative}
#tv{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 0 0 14px #1b1b1b,0 30px 80px rgba(0,0,0,.7);transform-origin:center;font-size:32px;line-height:1.35}
#tv :focus-visible{outline:6px solid #fff;outline-offset:6px}
#ctl{border-top:1px solid var(--line);background:var(--bg);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
#ctl p{color:var(--muted);font-size:12px;flex-basis:100%}
#ctl button{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid #6f6f6b;background:none;font-size:14px}
#ctl button.pw{background:var(--red);border-color:var(--red);color:#fff}
#ctl button:disabled{opacity:.4;cursor:not-allowed}
#ctl :focus-visible{outline:2px solid #fff;outline-offset:2px}
.lg{display:block}
.off{height:100%;display:grid;place-items:center;color:#3a3a3a;font-size:30px;position:relative;background:#000}
.led{position:absolute;right:70px;bottom:50px;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 14px rgba(215,25,33,.7)}
.boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.boot .lg{animation:pop 1.4s ease both}
.wm{font-size:44px;font-weight:500;letter-spacing:.3em}
.ld{width:480px;height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:30px}
.ld i{display:block;height:100%;background:var(--text);transform-origin:left;animation:fill 2.2s ease-in-out both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:0 160px}
.center h1{font-size:76px;font-weight:600;letter-spacing:-.02em}
.center p{color:var(--muted);font-size:36px;max-width:1200px}
.ck{list-style:none;display:grid;gap:18px;margin-top:20px;min-width:720px}
.ck li{display:flex;justify-content:space-between;gap:40px;background:var(--panel);border:2px solid var(--line);border-radius:26px;padding:20px 32px;font-size:34px;box-shadow:var(--sh)}
.ck .wait{color:#5a5a56}.ck .ok b{color:var(--ok)}.ck .bad b{color:var(--bad)}
.ck b{font-weight:500}
.tb{height:120px;display:flex;align-items:center;justify-content:space-between;padding:0 80px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:20px;font-size:40px;font-weight:600;letter-spacing:.12em}
.tbr{display:flex;align-items:center;gap:20px;font-size:30px}
.clk{font-size:36px;font-weight:500;margin-left:12px}
.chip{display:inline-flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:8px 24px;font-size:28px}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--ok)}
.chip.bad i{background:var(--bad)}
.banner{margin:28px 80px 0;padding:18px 32px;border-radius:24px;background:var(--panel);border:2px solid var(--bad);font-size:30px}
.home,.actm{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;padding:40px 80px;min-height:840px;align-content:center;align-items:center}
.card{background:var(--panel);border:2px solid var(--line);border-radius:40px;padding:48px;box-shadow:var(--sh)}
.lbl{color:var(--muted);font-size:30px}
.big{font-size:150px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:8px 0}
.big small{font-size:44px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-left:14px}
.sub{color:var(--muted);font-size:30px}
.trk{height:16px;border-radius:99px;background:var(--panel2);margin:36px 0 16px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--text);border-radius:99px}
.row{display:flex;gap:24px;margin-top:40px}
.tvb{min-height:88px;padding:0 48px;border-radius:99px;border:2px solid #6f6f6b;background:var(--panel2);font-size:34px;font-weight:500;box-shadow:var(--sh)}
.tvb.primary{background:var(--red);border-color:var(--red);color:#fff}
.side h2{font-size:42px;font-weight:600;margin-bottom:24px}
.steps{display:grid;gap:18px;padding-left:46px;font-size:32px;color:var(--text);margin-bottom:30px}
.steps li::marker{color:var(--muted)}
.side dl div{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-top:2px solid var(--line);font-size:30px}
.side dt{color:var(--muted)}.side dd{text-align:right}
.codec{text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px}
.code{font-size:104px;font-weight:600;letter-spacing:.06em;line-height:1;white-space:nowrap}
.wt{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:32px}
.wt i{width:16px;height:16px;border-radius:50%;background:var(--text);animation:pulse 1.4s infinite}
.actm h1{font-size:80px;font-weight:600;letter-spacing:-.02em;margin-bottom:16px}
.actm .lead{color:var(--muted);font-size:34px;margin-bottom:36px}
.ic svg{width:110px;height:110px}
.mod{position:absolute;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center}
.mod .card{width:1100px;background:#141414}
.mod h2{font-size:56px;font-weight:600;margin-bottom:28px}
.mod .row{justify-content:flex-end}
.note{color:var(--muted);font-size:26px;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ld i{transform:none}}
@media (forced-colors:active){.card,.chip,.tvb,#ctl button{border:2px solid CanvasText}}
</style>
</head>
<body>
<div id="stage"><div id="tv" role="region" aria-label="TV screen preview"></div></div>
<div id="ctl">
  <p>Demo controls. They stand in for the ORCA app and ORCA Cloud. No real payment is made and no real TV is controlled. Remote keys: arrows, Enter, Esc.</p>
  <button class="pw" id="bp" type="button">Power on</button>
  <button id="bn" type="button" aria-pressed="true">Wi-Fi: on</button>
  <button id="ba" type="button">Phone: activate TV</button>
  <button id="by" type="button">Phone: pay 38,000</button>
  <button id="bo" type="button">Cloud: mark overdue</button>
  <button id="br" type="button">Reset</button>
  <span class="sr" id="live" role="status" aria-live="polite"></span>
  <span id="msg" style="color:var(--muted);font-size:13px"></span>
</div>

var bp=document.getElementById('bp'),bn=document.getElementById('bn'),ba=document.getElementById('ba'),by=document.getElementById('by'),bo=document.getElementById('bo'),br=document.getElementById('br');
bp.onclick=function(){if(S.power){S.power=false;go('off');say('TV turned off.')}else{S.power=true;go('boot');say('TV turned on.')}};
bn.onclick=function(){S.net=!S.net;say(S.net?'Wi-Fi back on.':'Wi-Fi turned off.');
  if(S.power){if(S.net&&S.phase==='offline')go('check');else if(S.net&&S.queued>0&&(S.phase==='home'||S.phase==='restricted'))applyPay();else render()}else ctl()};
ba.onclick=function(){S.act=true;say('ORCA app confirmed the activation code.');go('linked')};
by.onclick=function(){if(!S.net){S.queued=S.due;say('Payment queued. It will apply when the TV is back online.');render();return}say('ORCA Cloud confirmed the demo payment.');applyPay()};
bo.onclick=function(){S.restricted=true;say('ORCA Cloud marked the installment overdue.');go('restricted')};
br.onclick=function(){clr();S=fresh();bn.setAttribute('aria-pressed',true);say('Demo reset.');go('off')};
tv.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var a=b.getAttribute('data-act');S.opener=a;S.focusTv=true;
  if(a==='howto'||a==='conn')S.modal=a;else if(a==='close')S.modal=null;
  else if(a==='newcode'){var c='';for(var i=0;i<6;i++)c+=Math.floor(Math.random()*10);S.code=c}
  else if(a==='retry'){go('check');return}
  render()});
document.addEventListener('keydown',function(e){var k=e.key;
  if(k==='Escape'||k==='Backspace'){if(S.modal){S.modal=null;S.focusTv=true;render();e.preventDefault()}return}
  if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].indexOf(k)<0)return;
  var root=tv.querySelector('.mod')||tv,f=[].slice.call(root.querySelectorAll('button:not([disabled])'));if(!f.length)return;
  var i=f.indexOf(document.activeElement),d=(k==='ArrowRight'||k==='ArrowDown')?1:-1;
  f[i<0?(d>0?0:f.length-1):(i+d+f.length)%f.length].focus();e.preventDefault()});
function fit(){var st=document.getElementById('stage'),s=Math.min((st.clientWidth-60)/1920,(st.clientHeight-50)/1080);tv.style.transform='translate(-50%,-50%) scale('+Math.max(s,.1)+')'}
window.addEventListener('resize',fit);fit();
render();
</script>
